# Copy to secret.yaml (gitignored) or create with:
#   ./scripts/k3s-secrets.sh
# Never commit real secret values.
apiVersion: v1
kind: Secret
metadata:
  name: rentme-secrets
  namespace: rentme
  labels:
    app.kubernetes.io/name: rentme
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  NEXTAUTH_SECRET: "CHANGE_ME_openssl_rand_base64_32"
  DATABASE_URL: "postgresql://rentme:CHANGE_ME_STRONG_PASSWORD@postgres:5432/rentme?schema=public"
  CLOUDFLARE_R2_ENDPOINT: ""
  CLOUDFLARE_S3_ACCESS_KEY_ID: ""
  CLOUDFLARE_S3_SECRET_ACCESS_KEY: ""
  CLOUDFLARE_R2_BUCKET: ""
  CLOUDFLARE_R2_PUBLIC_URL: ""
