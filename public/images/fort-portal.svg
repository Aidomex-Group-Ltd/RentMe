<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3f2"/>
      <stop offset="100%" stop-color="#fdf3d9"/>
    </linearGradient>
    <linearGradient id="fTea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d9e63"/>
      <stop offset="100%" stop-color="#256b45"/>
    </linearGradient>
    <linearGradient id="fMt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f2fb"/>
      <stop offset="100%" stop-color="#7fa3c4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#fSky)"/>
  <!-- Rwenzori foothills (Mountains of the Moon) -->
  <path d="M0 330 L140 190 L260 300 L400 150 L560 310 L700 210 L800 290 V420 H0 Z" fill="url(#fMt)" opacity=".95"/>
  <path d="M120 214 L140 190 L162 216 L140 206 Z" fill="#ffffff"/>
  <path d="M376 176 L400 150 L426 178 L400 164 Z" fill="#ffffff"/>
  <path d="M676 232 L700 210 L726 236 L700 222 Z" fill="#ffffff"/>
  <!-- cultural estate: bandas with thatched conical roofs -->
  <g>
    <g transform="translate(180,360)">
      <rect x="-46" y="0" width="92" height="70" fill="#a3703f"/>
      <path d="M-64 6 L0 -58 L64 6 Z" fill="#7c5628"/>
      <path d="M-50 0 L0 -48 L50 0 Z" fill="#c99a55"/>
      <rect x="-12" y="26" width="24" height="44" fill="#4a2f1c"/>
      <rect x="-38" y="14" width="18" height="16" fill="#ffd98c"/>
      <rect x="20" y="14" width="18" height="16" fill="#ffd98c"/>
    </g>
    <g transform="translate(430,392) scale(.82)">
      <rect x="-46" y="0" width="92" height="70" fill="#96653a"/>
      <path d="M-64 6 L0 -58 L64 6 Z" fill="#71501f"/>
      <path d="M-50 0 L0 -48 L50 0 Z" fill="#bd9050"/>
      <rect x="-12" y="26" width="24" height="44" fill="#452b1a"/>
    </g>
    <g transform="translate(640,368)">
      <rect x="-42" y="0" width="84" height="62" fill="#a3703f"/>
      <path d="M-58 4 L0 -52 L58 4 Z" fill="#7c5628"/>
      <path d="M-46 -2 L0 -44 L46 -2 Z" fill="#c99a55"/>
      <rect x="-11" y="24" width="22" height="38" fill="#4a2f1c"/>
    </g>
    <!-- totem-like cultural pillars -->
    <g fill="#5d3a1e">
      <rect x="320" y="356" width="10" height="74"/>
      <circle cx="325" cy="348" r="9" fill="#caa25a"/>
      <rect x="540" y="346" width="10" height="84"/>
      <circle cx="545" cy="338" r="9" fill="#caa25a"/>
    </g>
  </g>
  <!-- tea fields -->
  <rect y="430" width="800" height="170" fill="url(#fTea)"/>
  <g stroke="#67b57f" opacity=".8">
    <path d="M0 460 Q200 448 400 460 T800 458" stroke-width="7" fill="none"/>
    <path d="M0 500 Q220 488 440 500 T800 498" stroke-width="8" fill="none"/>
    <path d="M0 545 Q240 532 480 545 T800 543" stroke-width="9" fill="none"/>
    <path d="M0 585 Q260 574 520 585 T800 584" stroke-width="10" fill="none"/>
  </g>
</svg>
