<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" fill="none" aria-hidden="true" role="presentation">
  <!--
    Stylized Kampala skyline — NOT an accurate architectural rendering.
    Inspired by Kampala's urban character: hilly terrain, minarets,
    modern towers, and dense low-rise neighborhoods.
    Decorative only — use as subtle background atmosphere.
  -->
  <defs>
    <linearGradient id="sky-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d8f6e" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0d8f6e" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#172554" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="building-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d8f6e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#172554" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Background fill -->
  <rect width="1440" height="400" fill="url(#sky-fill)"/>

  <!-- Distant hills — Kampala's characteristic rolling terrain -->
  <path d="M0 340 Q120 290 240 310 Q360 330 480 300 Q600 270 720 290 Q840 310 960 280 Q1080 250 1200 270 Q1320 290 1440 310 L1440 400 L0 400Z" fill="url(#building-grad)" opacity="0.4"/>

  <!-- Mid-ground buildings — mixed low-rise -->
  <path d="M0 360 L60 360 L60 330 L80 330 L80 360 L120 360 L120 310 L140 310 L140 360 L180 360 L180 340 L200 340 L200 320 L220 320 L220 360 L260 360 L260 295 L280 295 L280 280 L300 280 L300 360 L340 360 L340 320 L360 320 L360 360 L400 360 L400 305 L420 305 L420 290 L440 290 L440 360 L480 360 L480 335 L500 335 L500 360 L540 360 L540 300 L560 300 L560 280 L580 280 L580 260 L600 260 L600 360 L640 360 L640 310 L660 310 L660 360 L700 360 L700 325 L720 325 L720 360 L760 360 L760 290 L780 290 L780 270 L800 270 L800 255 L820 255 L820 360 L860 360 L860 315 L880 315 L880 360 L920 360 L920 300 L940 300 L940 285 L960 285 L960 360 L1000 360 L1000 330 L1020 330 L1020 360 L1060 360 L1060 295 L1080 295 L1080 275 L1100 275 L1100 360 L1140 360 L1140 310 L1160 310 L1160 360 L1200 360 L1200 320 L1220 320 L1220 360 L1260 360 L1260 305 L1280 305 L1280 280 L1300 280 L1300 360 L1340 360 L1340 330 L1360 330 L1360 360 L1400 360 L1400 340 L1440 340 L1440 400 L0 400Z" fill="url(#building-grad)" opacity="0.5"/>

  <!-- Key landmarks — simplified silhouettes -->

  <!-- Uganda Mosque (Old Kampala) minaret -->
  <rect x="575" y="210" width="10" height="50" rx="2" fill="#0d8f6e" opacity="0.12"/>
  <ellipse cx="580" cy="210" rx="8" ry="5" fill="#0d8f6e" opacity="0.10"/>

  <!-- Nakivubo area — dense commercial -->
  <rect x="620" y="270" width="30" height="90" rx="2" fill="#172554" opacity="0.06"/>
  <rect x="660" y="285" width="25" height="75" rx="2" fill="#172554" opacity="0.05"/>

  <!-- Entebbe Road area — modern tower -->
  <rect x="800" y="220" width="20" height="140" rx="3" fill="#0d8f6e" opacity="0.08"/>
  <rect x="795" y="220" width="30" height="8" rx="2" fill="#0d8f6e" opacity="0.10"/>

  <!-- Kololo/Naguru — hilltop buildings -->
  <rect x="930" y="255" width="16" height="105" rx="2" fill="#172554" opacity="0.06"/>
  <rect x="960" y="265" width="22" height="95" rx="2" fill="#0d8f6e" opacity="0.06"/>

  <!-- Speke Tower area -->
  <rect x="1075" y="240" width="14" height="120" rx="2" fill="#0d8f6e" opacity="0.09"/>
  <rect x="1072" y="240" width="20" height="6" rx="1" fill="#0d8f6e" opacity="0.11"/>

  <!-- Kampala Hilton area -->
  <rect x="1270" y="245" width="18" height="115" rx="2" fill="#172554" opacity="0.07"/>

  <!-- Trees / greenery dots -->
  <circle cx="150" cy="350" r="6" fill="#0d8f6e" opacity="0.08"/>
  <circle cx="170" cy="345" r="8" fill="#0d8f6e" opacity="0.06"/>
  <circle cx="450" cy="355" r="5" fill="#0d8f6e" opacity="0.07"/>
  <circle cx="750" cy="350" r="7" fill="#0d8f6e" opacity="0.06"/>
  <circle cx="1150" cy="348" r="6" fill="#0d8f6e" opacity="0.07"/>
  <circle cx="1350" cy="352" r="5" fill="#0d8f6e" opacity="0.05"/>

  <!-- Horizon line -->
  <line x1="0" y1="360" x2="1440" y2="360" stroke="#0d8f6e" stroke-opacity="0.08" stroke-width="1"/>
</svg>
