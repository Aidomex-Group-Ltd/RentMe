<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="35%" stop-color="#5a3d6e"/>
      <stop offset="62%" stop-color="#c96f4a"/>
      <stop offset="82%" stop-color="#f2a65a"/>
      <stop offset="100%" stop-color="#ffd08a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8934e"/>
      <stop offset="45%" stop-color="#8a4d52"/>
      <stop offset="100%" stop-color="#232c47"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="55%" stop-color="#ffc46b" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffb257" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="620" fill="url(#sky)"/>
  <circle cx="800" cy="600" r="150" fill="#ffdf9e"/>
  <circle cx="800" cy="600" r="300" fill="url(#sunGlow)"/>

