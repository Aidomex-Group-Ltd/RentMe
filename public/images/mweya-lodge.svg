<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7c873"/>
      <stop offset="55%" stop-color="#e98a4e"/>
      <stop offset="100%" stop-color="#b5563e"/>
    </linearGradient>
    <linearGradient id="mWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97b45"/>
      <stop offset="100%" stop-color="#5e3141"/>
    </linearGradient>
    <radialGradient id="mSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2cf"/><stop offset="100%" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="380" fill="url(#mSky)"/>
  <circle cx="620" cy="330" r="70" fill="#ffe3ae"/>
  <circle cx="620" cy="330" r="140" fill="url(#mSun)"/>
  <!-- acacia trees -->
  <g fill="#4a2c33">
    <rect x="96" y="270" width="9" height="80"/>
    <path d="M60 268 q46 -34 84 -2 q-44 -12 -88 8 z"/>
    <path d="M100 262 q-30 -40 -74 -38 q40 -2 82 42 z"/>
    <rect x="238" y="286" width="7" height="64"/>
    <path d="M212 284 q34 -26 62 -2 q-33 -9 -65 6 z"/>
  </g>
  <!-- lodge: thatched roofs on the ridge -->
  <g>
    <rect x="420" y="300" width="180" height="52" fill="#6b3d38"/>
    <path d="M400 304 L510 240 L620 304 Z" fill="#8a5a3b"/>
    <path d="M415 296 L510 244 L605 296 Z" fill="#c98d54"/>
    <rect x="448" y="316" width="22" height="36" fill="#3c2226"/>
    <rect x="500" y="316" width="22" height="36" fill="#3c2226"/>
    <rect x="552" y="316" width="22" height="36" fill="#ffd98c"/>
    <rect x="330" y="318" width="66" height="34" fill="#59332f"/>
    <path d="M320 320 L363 280 L406 320 Z" fill="#7c4e37"/>
    <path d="M330 314 L363 286 L396 314 Z" fill="#bd8352"/>
  </g>
  <!-- Kazinga channel -->
  <rect y="352" width="800" height="248" fill="url(#mWater)"/>
  <g stroke="#ffc27d" opacity=".45" stroke-width="4">
    <path d="M120 400 H340 M480 430 H700 M220 480 H520 M360 530 H640"/>
  </g>
  <!-- hippo pod -->
  <g fill="#2c1a24">
    <ellipse cx="250" cy="392" rx="26" ry="12"/>
    <ellipse cx="290" cy="400" rx="18" ry="9"/>
    <ellipse cx="560" cy="472" rx="24" ry="11"/>
  </g>
  <g fill="#e8a25c" opacity=".8"><circle cx="242" cy="388" r="2.4"/><circle cx="258" cy="388" r="2.4"/></g>
  <!-- egret -->
  <path d="M470 350 q10 -12 22 -4 q-12 0 -22 4" fill="#fff" opacity=".9"/>
</svg>
