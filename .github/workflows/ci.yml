name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_NAME: aidomex-group-ltd/rentme

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rentme
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: rentme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public

      - name: Push database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public

      - name: Lint / tests
        run: npm test
        env:
          CI: "true"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit stage gates (Stages 1–7)
        run: npm run test:gates

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-production
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # Stage 11 gate — keep client bundles lean for <3s page loads.
      - name: Bundle size guard
        run: |
          BIG=$(find .next/static -name "*.js" -size +500k 2>/dev/null || true)
          if [ -n "$BIG" ]; then
            echo "::error::Client chunks exceed 500KB:"
            echo "$BIG"
            exit 1
          fi
          echo "✓ All client JS chunks are under 500KB"

      - name: Validate kustomize
        run: |
          kubectl kustomize k8s/overlays/production > /tmp/rentme-manifests.yaml
          test -s /tmp/rentme-manifests.yaml
          echo "✓ kustomize OK"

      - name: Start app for smoke tests
        run: |
          npm start &
          echo $! > /tmp/rentme-ci.pid
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          exit 1
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-production
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: E2E smoke
        run: npm run test:e2e -- http://127.0.0.1:3000
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-production

      # Full stage-gate matrix (Stages 2–10) against the booted app.
      # Each client carries a synthetic X-Forwarded-For so per-IP rate-limit
      # buckets stay isolated between suites; 429 assertions stay genuine.
      - name: E2E stage gates
        run: |
          set -e
          node tests/stage2-messaging.e2e.mjs http://127.0.0.1:3000
          node tests/stage3-video.e2e.mjs http://127.0.0.1:3000
          node tests/stage45-fees.e2e.mjs http://127.0.0.1:3000
          node tests/stage7-chatbot.e2e.mjs http://127.0.0.1:3000
          node scripts/e2e-stage14-smoke.mjs http://127.0.0.1:3000
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-production

      - name: Zero-trust security audit
        run: node scripts/e2e-security-audit.mjs http://127.0.0.1:3000
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-production

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/rentme-ci.pid ]; then kill "$(cat /tmp/rentme-ci.pid)" || true; fi

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Raw commit SHA so deploy-k3s can pull :${{ github.sha }}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://erikot.site' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-k3s:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── Configure kubectl from KUBE_CONFIG secret ──────────────────
      # KUBE_CONFIG must be base64-encoded (single line, no newlines).
      #
      # On your k3s server, run:
      #   sudo sed -i 's/127.0.0.1/$(curl -s ifconfig.me)/' /etc/rancher/k3s/k3s.yaml
      #   cat /etc/rancher/k3s/k3s.yaml | base64 -w 0 | pbcopy
      #
      # Then paste into GitHub → Settings → Secrets → Actions → KUBE_CONFIG
      - name: Configure kubectl from KUBE_CONFIG secret
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "${KUBE_CONFIG_B64}" ]; then
            echo "::error::KUBE_CONFIG secret is empty or not set."
            echo ""
            echo "Set it (base64-encoded) in GitHub → Settings → Secrets → Actions:"
            echo "  On your k3s server:"
            echo "    sudo sed -i 's/127.0.0.1/\$(curl -s ifconfig.me)/' /etc/rancher/k3s/k3s.yaml"
            echo "    cat /etc/rancher/k3s/k3s.yaml | base64 -w 0 | pbcopy"
            echo "  Then paste into KUBE_CONFIG secret."
            exit 1
          fi

          KUBECONFIG_PATH="${HOME}/.kube/config"
          mkdir -p "${HOME}/.kube"

          # Decode from base64
          printf '%s' "${KUBE_CONFIG_B64}" | base64 -d > "${KUBECONFIG_PATH}" 2>/dev/null || {
            echo "::error::KUBE_CONFIG is not valid base64."
            echo "Re-encode with: cat /etc/rancher/k3s/k3s.yaml | base64 -w 0 | pbcopy"
            exit 1
          }

          # Validate it looks like a kubeconfig
          if ! grep -qE '^apiVersion:' "${KUBECONFIG_PATH}"; then
            echo "::error::Decoded content does not look like a kubeconfig (missing apiVersion)."
            echo "First 80 chars: $(head -c 80 "${KUBECONFIG_PATH}")"
            exit 1
          fi

          chmod 600 "${KUBECONFIG_PATH}"
          echo "KUBECONFIG=${KUBECONFIG_PATH}" >> "${GITHUB_ENV}"
          echo "✓ kubeconfig written to ${KUBECONFIG_PATH}"
          grep -E '^(apiVersion|kind|clusters|contexts|users|current-context):' "${KUBECONFIG_PATH}" || true

      - name: Verify cluster connectivity
        run: |
          set -euo pipefail
          echo "→ kubectl version"
          kubectl version --client --short 2>/dev/null || kubectl version --client
          echo ""
          echo "→ kubectl cluster-info"
          kubectl cluster-info
          echo ""
          echo "→ kubectl get nodes"
          kubectl get nodes -o wide
          echo ""
          echo "✓ Cluster reachable"

      # ── E2E k3s deployment verification ────────────────────────────
      - name: "E2E: Verify namespace and secrets"
        run: |
          set -euo pipefail
          NS="rentme"

          echo "→ Ensure namespace ${NS}"
          kubectl get ns "${NS}" >/dev/null 2>&1 || kubectl create namespace "${NS}"

          echo "→ Verify rentme-secrets"
          kubectl -n "${NS}" get secret rentme-secrets >/dev/null 2>&1 || {
            echo "::error::rentme-secrets not found in namespace ${NS}"
            echo "Create with: make k3s-secrets"
            echo "  export POSTGRES_PASSWORD=... NEXTAUTH_SECRET=..."
            echo "  ./scripts/k3s-secrets.sh"
            exit 1
          }

          echo "→ Verify ghcr-pull"
          kubectl -n "${NS}" get secret ghcr-pull >/dev/null 2>&1 || {
            echo "::error::ghcr-pull not found in namespace ${NS}"
            echo "Create with: make k3s-registry"
            echo "  export GHCR_USER=... GHCR_TOKEN=..."
            echo "  ./scripts/k3s-registry.sh"
            exit 1
          }

          echo "→ Verify rentme-config ConfigMap"
          kubectl -n "${NS}" get configmap rentme-config >/dev/null 2>&1 || {
            echo "::error::rentme-config not found in namespace ${NS}"
            echo "Apply with: kubectl apply -k k8s/overlays/production"
            exit 1
          }

          echo "✓ All prerequisites present in namespace ${NS}"

      - name: "E2E: Verify kustomize applies cleanly"
        run: |
          set -euo pipefail
          echo "→ Dry-run kustomize production overlay"
          kubectl kustomize k8s/overlays/production | kubectl apply --dry-run=client -f - 2>&1
          echo "✓ Kustomize dry-run passed"

      - name: "E2E: Deploy (backup → migrate → rollout → health)"
        env:
          RENTME_IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RENTME_IMAGE_TAG: ${{ github.sha }}
          PROD_DOMAIN: ${{ vars.PRODUCTION_DOMAIN || 'erikot.site' }}
          KUBECTL: kubectl
        run: ./scripts/k3s-deploy.sh "${GITHUB_SHA}"

      - name: "E2E: Verify deployment status"
        if: always()
        run: |
          set -euo pipefail
          NS="rentme"

          echo "=== Pods ==="
          kubectl -n "${NS}" get pods -o wide

          echo ""
          echo "=== Deployments ==="
          kubectl -n "${NS}" get deployments

          echo ""
          echo "=== Services ==="
          kubectl -n "${NS}" get services

          echo ""
          echo "=== Ingress ==="
          kubectl -n "${NS}" get ingress

          echo ""
          echo "=== Jobs ==="
          kubectl -n "${NS}" get jobs

          echo ""
          echo "=== PVCs ==="
          kubectl -n "${NS}" get pvc

          echo ""
          echo "=== Deployment rollout status ==="
          kubectl -n "${NS}" rollout status deployment/rentme-app --timeout=60s 2>/dev/null || echo "WARN: rollout not ready"

      - name: "E2E: Health check via port-forward"
        if: always()
        run: |
          set -euo pipefail
          NS="rentme"

          echo "→ Port-forwarding to rentme-app:80 → localhost:18080"
          kubectl -n "${NS}" port-forward svc/rentme-app 18080:80 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          cleanup() { kill "${PF_PID}" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 5

          echo "→ Health check (up to 60s)"
          HEALTHY=false
          for i in $(seq 1 20); do
            RESP=$(curl -sf http://127.0.0.1:18080/api/health 2>/dev/null || echo '{"status":"unreachable"}')
            STATUS=$(echo "${RESP}" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
            echo "  Attempt ${i}/20: ${STATUS:-waiting}"
            if [ "${STATUS}" = "healthy" ]; then
              HEALTHY=true
              break
            fi
            sleep 3
          done

          if [ "${HEALTHY}" = "true" ]; then
            echo "✓ Application is healthy"
          else
            echo "::error::Health check failed after 60s"
            echo "Last response: ${RESP}"
            echo ""
            echo "=== Pod logs (last 30 lines) ==="
            kubectl -n "${NS}" logs -l app.kubernetes.io/component=app --tail=30 2>/dev/null || true
            exit 1
          fi

      - name: "E2E: Production smoke test"
        if: always()
        run: |
          set -euo pipefail
          DOMAIN="${{ vars.PRODUCTION_DOMAIN || 'erikot.site' }}"

          echo "→ Public health check: https://${DOMAIN}/api/health"
          RESP=$(curl -sf "https://${DOMAIN}/api/health" 2>/dev/null || echo '{"status":"unreachable"}')
          echo "Response: ${RESP}"

          if echo "${RESP}" | grep -q '"status":"healthy"'; then
            echo "✓ Public health OK"
          else
            echo "WARN: Public health check did not return healthy (DNS/TLS may still be provisioning)"
          fi

      - name: "E2E: Full endpoint checks"
        if: always()
        run: |
          set -euo pipefail
          DOMAIN="${{ vars.PRODUCTION_DOMAIN || 'erikot.site' }}"

          echo "→ Checking key endpoints"
          FAILURES=0

          for path in "/" "/api/health" "/api/properties"; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://${DOMAIN}${path}" 2>/dev/null || echo "000")
            if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 400 ]; then
              echo "  ✓ ${path} → HTTP ${STATUS}"
            else
              echo "  ✗ ${path} → HTTP ${STATUS}"
              FAILURES=$((FAILURES + 1))
            fi
          done

          if [ "${FAILURES}" -gt 0 ]; then
            echo "WARN: ${FAILURES} endpoint(s) returned non-2xx status"
          else
            echo "✓ All endpoints healthy"
          fi

      - name: "E2E: Collect diagnostics on failure"
        if: failure()
        run: |
          NS="rentme"
          echo "=== Pod describe (rentme-app) ==="
          kubectl -n "${NS}" describe deploy rentme-app 2>/dev/null || true
          echo ""
          echo "=== Pod logs (last 50 lines) ==="
          kubectl -n "${NS}" logs -l app.kubernetes.io/component=app --tail=50 2>/dev/null || true
          echo ""
          echo "=== Recent events ==="
          kubectl -n "${NS}" get events --sort-by='.lastTimestamp' | tail -20 || true

      # ── Rollback + Slack notification on failure ──────────────────
      - name: "Rollback on deployment failure"
        if: failure()
        run: |
          NS="rentme"
          echo "→ Rolling back rentme-app to previous revision"
          kubectl -n "${NS}" rollout undo deployment/rentme-app 2>/dev/null || echo "WARN: rollback failed"
          kubectl -n "${NS}" rollout status deployment/rentme-app --timeout=120s 2>/dev/null || echo "WARN: rollback did not converge"
          echo "✓ Rollback triggered"

      - name: "Notify Slack on failure"
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi

          REPO="${GITHUB_REPOSITORY}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          ACTOR="${GITHUB_ACTOR}"
          REF="${GITHUB_REF_NAME}"
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)

          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(printf '{"text":"🚨 *Deploy FAILED* — %s\nBranch: %s\nCommit: <%s|%s>\nTriggered by: %s\nAuto-rollback: ✅ Executed\n<%s|View run>"}' \
              "${REPO}" "${REF}" "${COMMIT_URL}" "${SHA_SHORT}" "${ACTOR}" "${RUN_URL}")" \
            "${SLACK_WEBHOOK_URL}"
          echo "✓ Slack failure notification sent"

      - name: "Notify Slack on success"
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then exit 0; fi

          REPO="${GITHUB_REPOSITORY}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)

          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(printf '{"text":"✅ *Deploy succeeded* — %s @ %s\n<%s|View run>"}' \
              "${REPO}" "${SHA_SHORT}" "${RUN_URL}")" \
            "${SLACK_WEBHOOK_URL}"
          echo "✓ Slack success notification sent"
