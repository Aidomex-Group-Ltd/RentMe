name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Test & Build ──────────────────────────────────────
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rentme
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: rentme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup database environment
        run: |
          echo "DATABASE_URL=postgresql://rentme:test_password@localhost:5432/rentme?schema=public" >> .env
          echo "NEXTAUTH_SECRET=test-secret-for-ci" >> .env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Run build
        run: npm run build
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run E2E tests
        run: npm run test:e2e --if-present
        continue-on-error: true
        env:
          E2E_BASE_URL: http://localhost:3000

  # ─── Docker Build & Push ──────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://rentme.ug' }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✓ Docker image verified"

  # ─── Deployment ────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/rentme
            git pull origin main
            
            # Pull the latest Docker image
            docker compose pull app
            
            # Create database backup before deploy
            docker compose exec -T db pg_dump -U rentme rentme | \
              gzip > /tmp/rentme_pre_deploy_$(date +%Y%m%d_%H%M%S).sql.gz
            
            # Run migrations
            docker compose run --rm app npx prisma db push --skip-generate
            
            # Start new version (zero-downtime)
            docker compose up -d --no-deps app
            
            # Wait for health check
            echo "Waiting for health check..."
            for i in $(seq 1 15); do
              sleep 4
              HEALTH=$(curl -sf http://localhost:3000/api/health | grep -o '"status":"healthy"' || echo "")
              if [ -n "$HEALTH" ]; then
                echo "✓ Application is healthy"
                exit 0
              fi
              echo "  Attempt $i/15..."
            done
            
            echo "✗ Health check failed - rolling back"
            docker compose down app
            docker compose up -d app
            exit 1

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf https://${{ vars.PRODUCTION_DOMAIN || 'rentme.ug' }}/api/health || \
            echo "⚠ Could not verify production deployment"
