name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_NAME: aidomex-group-ltd/rentme

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rentme
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: rentme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public

      - name: Push database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public

      - name: Lint / tests
        run: npm test
        env:
          CI: "true"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-production
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Validate kustomize
        run: |
          kubectl kustomize k8s/overlays/production > /tmp/rentme-manifests.yaml
          test -s /tmp/rentme-manifests.yaml
          echo "✓ kustomize OK"

      - name: Start app for smoke tests
        run: |
          npm start &
          echo $! > /tmp/rentme-ci.pid
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          exit 1
        env:
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-production
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: E2E smoke
        run: npm run test:e2e -- http://127.0.0.1:3000
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://rentme:test_password@localhost:5432/rentme?schema=public
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-production

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/rentme-ci.pid ]; then kill "$(cat /tmp/rentme-ci.pid)" || true; fi

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Raw commit SHA so deploy-k3s can pull :${{ github.sha }}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://rentme.ug' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-k3s:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── Validate kubeconfig secret exists before setting context ──
      # Required secret: KUBE_CONFIG (base64-encoded or raw kubeconfig content)
      # Create with: kubectl config view --raw --minify | base64 > /tmp/kubeconfig.b64
      # Then set in GitHub → Settings → Secrets → Actions → KUBE_CONFIG
      - name: Validate kubeconfig secret
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::error::KUBE_CONFIG secret is not set. Go to GitHub → Settings → Secrets → Actions and create KUBE_CONFIG."
            echo "The value should be the raw kubeconfig content from your k3s cluster."
            echo "Export with: cat /etc/rancher/k3s/k3s.yaml"
            exit 1
          fi
          echo "✓ KUBE_CONFIG secret is present"

      - name: Configure kubectl
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Ensure secrets exist
        run: |
          kubectl get ns rentme >/dev/null 2>&1 || kubectl create namespace rentme
          kubectl -n rentme get secret rentme-secrets >/dev/null 2>&1 || {
            echo "rentme-secrets missing — create once with make k3s-secrets on the cluster"
            exit 1
          }
          kubectl -n rentme get secret ghcr-pull >/dev/null 2>&1 || {
            echo "ghcr-pull missing — create once with make k3s-registry (GHCR_USER + GHCR_TOKEN)"
            exit 1
          }

      - name: Deploy (backup → migrate → rollout → health)
        env:
          RENTME_IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RENTME_IMAGE_TAG: ${{ github.sha }}
          PROD_DOMAIN: ${{ vars.PRODUCTION_DOMAIN || 'rentme.ug' }}
          KUBECTL: kubectl
        run: ./scripts/k3s-deploy.sh "${GITHUB_SHA}"

      - name: Production smoke
        run: |
          DOMAIN="${{ vars.PRODUCTION_DOMAIN || 'rentme.ug' }}"
          sleep 5
          curl -sf "https://${DOMAIN}/api/health" | tee /tmp/health.json
          grep -q '"status":"healthy"' /tmp/health.json
